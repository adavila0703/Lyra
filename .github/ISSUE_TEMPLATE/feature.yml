name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should Lyra do instead?
    validations:
      required: true
  - type: checkboxes
    id: local
    attributes:
      label: Local-first
      options:
        - label: This stays on-device (no cloud APIs, chat LLMs, or telemetry in v1)
          required: true
