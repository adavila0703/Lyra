appId: com.voicepages.app
productName: Lyra
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - '**/*.node'
  - '**/*.dylib'
  - '**/*.dll'
  - '**/*.so'
  - '**/*.so.*'
  - node_modules/@kutalia/whisper-node-addon/**
win:
  icon: build/icon.png
  executableName: Lyra
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Lyra records audio so it can transcribe your pages on this device.
    NSDocumentsFolderUsageDescription: Lyra stores your markdown pages on disk.
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: Lyra contributors
  category: Office
  synopsis: Local voice notebook
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
